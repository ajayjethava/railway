<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>🚆 Edit {{ display_name }} Row | Railway Signalling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚆</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">🚆 Railway Signalling</a>
    <div class="ms-auto">
      <a class="btn btn-outline-success" href="{{ url_for('main.workflow_step', step=step) }}">
        <i class="bi bi-arrow-left"></i> Back to Step {{ step }}
      </a>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-info">
        {% for m in messages %}<div>{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-warning">
          <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit {{ display_name }} Row</h5>
        </div>
        <div class="card-body">
          <form method="post">
            {% for col in columns %}
            <div class="mb-3">
              <label for="{{ col }}" class="form-label">{{ col.replace('_',' ').title() }}</label>
              <input type="text" id="{{ col }}" name="{{ col }}" class="form-control"
                     value="{{ row.get(col, '') }}"
                     placeholder="Enter {{ col.replace('_',' ').lower() }}">
            </div>
            {% endfor %}
            <div class="d-flex justify-content-between">
              <a href="{{ url_for('main.workflow_step', step=step) }}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancel
              </a>
              <button type="submit" class="btn btn-warning">
                <i class="bi bi-check-circle"></i> Update Row
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
