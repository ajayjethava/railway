<!-- Success Modal -->
<div class="modal fade" id="successFlashModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="false">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-success">
      <div class="modal-body text-center py-4 bg-success text-white">
        <i class="bi bi-check-circle-fill" style="font-size: 3rem;"></i>
        <p class="mt-2 mb-0 fw-bold">Success!</p>
      </div>
    </div>
  </div>
</div>

<!-- Error Modal -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Error</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
        <p id="errorMessage" class="mt-3 mb-0"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
