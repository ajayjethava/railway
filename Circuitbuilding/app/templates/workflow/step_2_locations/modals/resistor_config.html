<!-- Resistor Configuration Modal -->
<div class="modal fade" id="resistorConfigModal" tabindex="-1" aria-labelledby="resistorConfigModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="resistorConfigModalLabel">
          <i class="bi bi-collection"></i> Configure Resistor Data
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info">
          <i class="bi bi-info-circle"></i> Configure resistor entries for the current cable.
        </div>
        
        <div class="mb-3">
          <label class="form-label"><strong>Cable Id</strong></label>
          <input type="text" class="form-control" id="resistorCableId" readonly>
        </div>
        
        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead class="table-light">
              <tr>
                <th>Cable Id</th>
                <th>Resistor Id</th>
                <th>Input Terminal</th>
                <th>Output Terminal</th>
                <th>Resistor Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="resistorTableBody">
              <!-- Resistor rows will be generated here -->
            </tbody>
          </table>
        </div>
        
        <div class="mt-3">
          <button type="button" class="btn btn-sm btn-outline-primary" id="addResistorRowBtn">
            <i class="bi bi-plus-circle"></i> Add Resistor Row
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <!-- Previous Button to go back to Terminal Modal -->
        <button type="button" class="btn btn-info" id="resistorPreviousBtn">
          <i class="bi bi-arrow-left"></i> Previous
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-success" id="saveAllResistorsBtn">
          <i class="bi bi-check-circle"></i> Save All Resistors
        </button>
      </div>
    </div>
  </div>
</div>
